<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HR Operations Platform — Interactive Delivery Roadmap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geologica:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F2F0;--paper:#FAFAF8;--ink:#15171A;--ink2:#2A2D33;
  --ink-soft:#555A63;--ink-faint:#8A8E97;--accent:#2A6FDB;
  --accent2:#6FB3C9;--bg-alt:#E7E7E3;--rule:rgba(21,23,26,.14);
  --on-dark:#EAEAE6;--sidebar:#15171A;--sidebar-h:#1E2227;
  --sidebar-a:#232830;--focus:#2A6FDB;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Geologica',system-ui,sans-serif;font-size:13px;background:var(--bg);color:var(--ink);line-height:1.5}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer}
.wrap{max-width:1020px;margin:0 auto;padding:20px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:3px}
.hdr{background:var(--sidebar);border-radius:10px;padding:22px 24px;margin-bottom:14px}
.hdr-top{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
.hdr-badge{display:inline-flex;align-items:center;gap:7px;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.hdr-badge-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:pls 1.5s ease infinite}
@media (prefers-reduced-motion: reduce){.hdr-badge-dot{animation:none}}
.hdr-t{color:var(--on-dark);font-size:17px;font-weight:700;letter-spacing:-.01em}
.hdr-s{color:rgba(234,234,230,.5);font-size:11px;margin-top:3px}
.hdr-note{color:rgba(234,234,230,.38);font-size:10.5px;margin-top:6px;max-width:520px;line-height:1.5}
.hdr-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.hdr-eng{text-align:right}
.hdr-eng-lbl{font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:rgba(234,234,230,.3)}
.hdr-eng-name{font-size:13px;font-weight:700;color:var(--on-dark);margin-top:2px}
.hdr-status{font-size:10.5px;font-weight:700;padding:5px 11px;border-radius:5px;background:rgba(42,111,219,.18);color:#6FB3C9;white-space:nowrap}
.pb{height:5px;background:rgba(255,255,255,.09);border-radius:3px;overflow:hidden;margin:0 0 5px}
.pbf{height:100%;background:var(--accent);border-radius:3px;transition:width .4s}
@media (prefers-reduced-motion: reduce){.pbf{transition:none}}
.prow{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px;font-size:11px}
.prow span:first-child{color:rgba(234,234,230,.5)}
.prow span:last-child{color:var(--accent);font-weight:700}
.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:8px;margin-bottom:14px}
.sg{background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:11px;text-align:center}
.sgn{font-size:21px;font-weight:700;color:var(--ink);line-height:1}
.sgl{font-size:10px;color:var(--ink-faint);margin-top:3px;font-weight:500}
.tabs{display:flex;flex-wrap:wrap;background:var(--paper);border:1px solid var(--rule);border-radius:8px;overflow:hidden;margin-bottom:12px}
.tab-btn{flex:1 1 160px;padding:10px 14px;font-size:12.5px;font-weight:600;color:var(--ink-soft);cursor:pointer;text-align:center;border-right:1px solid var(--rule);transition:all .15s}
.tab-btn:last-child{border-right:none}
.tab-btn:hover{background:var(--bg-alt)}
.tab-btn[aria-selected="true"]{background:var(--sidebar);color:var(--on-dark)}
.fbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.fb{font-size:11.5px;font-weight:600;padding:5px 11px;border-radius:5px;border:1px solid var(--rule);background:var(--paper);cursor:pointer;color:var(--ink-soft);transition:all .15s}
.fb:hover{border-color:rgba(21,23,26,.22)}
.fb[aria-pressed="true"]{background:var(--sidebar);color:var(--on-dark);border-color:var(--sidebar)}
.ph{background:var(--paper);border:1px solid var(--rule);border-radius:9px;margin-bottom:7px;overflow:hidden}
.phh{all:unset;display:flex;align-items:center;gap:10px;padding:12px 15px;cursor:pointer;transition:background .15s;width:100%;box-sizing:border-box}
.phh:hover{background:var(--bg-alt)}
.phd{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.phn{flex:1;min-width:0;text-align:left}
.phnt{font-size:13px;font-weight:700;color:var(--ink)}
.phns{font-size:11px;color:var(--ink-faint);margin-top:1px;font-weight:400}
.phpr{display:flex;align-items:center;gap:8px;flex-shrink:0}
.phpb{width:60px;height:4px;background:var(--bg-alt);border-radius:2px;overflow:hidden}
.phpbf{height:100%;border-radius:2px}
.phct{font-size:11px;color:var(--ink-faint);min-width:32px;text-align:right;font-weight:500}
.pharr{font-size:13px;color:var(--ink-faint);transition:transform .2s;flex-shrink:0;display:inline-block}
.pharr.op{transform:rotate(90deg)}
@media (prefers-reduced-motion: reduce){.pharr{transition:none}}
.pbody{border-top:1px solid var(--rule)}
.tk{display:flex;align-items:flex-start;gap:10px;padding:9px 15px;border-bottom:1px solid var(--rule);cursor:pointer;transition:background .15s}
.tk:last-child{border-bottom:none}
.tk:hover{background:var(--bg)}
.tk.dn{background:var(--bg)}
.cb-input{position:absolute;opacity:0;width:16px;height:16px;margin:0;cursor:pointer}
.cb-wrap{position:relative;width:16px;height:16px;flex-shrink:0;margin-top:1px}
.cb{width:16px;height:16px;border:1.5px solid var(--bg-alt);border-radius:4px;display:flex;align-items:center;justify-content:center;transition:all .15s;pointer-events:none}
.cb.ck{background:var(--accent);border-color:var(--accent)}
.cb-input:focus-visible ~ .cb{outline:2px solid var(--focus);outline-offset:2px}
.tkt{font-size:12.5px;font-weight:500;color:var(--ink2);line-height:1.4}
.tkt.dn{color:var(--ink-faint);text-decoration:line-through}
.tags{display:flex;gap:4px;margin-top:5px;flex-wrap:wrap}
.tag{font-size:10px;font-weight:700;padding:2px 6px;border-radius:3px;letter-spacing:.01em}
.pc{background:#FEE2E2;color:#991B1B}.ph2{background:#FEF3C7;color:#92400E}
.pm{background:#F0FDF4;color:#14532D}.pl{background:#F5F3FF;color:#5B21B6}
.tn{background:#EFF6FF;color:#1E3A8A;font-weight:800}
.ts{background:#E0F2FE;color:#075985;font-weight:800}
.tpr{background:rgba(42,111,219,.1);color:var(--accent)}
.tcx{background:var(--bg-alt);color:var(--ink-soft)}
.nb-badge{display:inline-block;font-size:9px;font-weight:800;padding:1px 6px;border-radius:3px;background:rgba(42,111,219,.12);color:var(--accent);margin-left:6px;vertical-align:middle;letter-spacing:.05em;text-transform:uppercase}
.empty-state{padding:16px 15px;font-size:12px;color:var(--ink-faint);font-style:italic}
/* banners */
.banner{border-radius:8px;padding:11px 14px;margin-bottom:12px;font-size:12px;color:#15171A;background:rgba(42,111,219,.07);border:1px solid rgba(42,111,219,.15);border-left:4px solid #2A6FDB}
.banner-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.banner-pill{font-size:11px;font-weight:700;padding:5px 11px;border-radius:5px;background:#2A6FDB;color:#EAEAE6;white-space:nowrap;flex-shrink:0}
/* Vendor */
.valert{background:#FFF9EC;border:1px solid rgba(180,93,0,.2);border-left:4px solid #B45D00;border-radius:8px;padding:12px 14px;margin-bottom:12px;font-size:12px;color:#7C3D00;line-height:1.7}
.vnote-global{font-size:11px;color:var(--ink-soft);margin-top:8px;padding-top:8px;border-top:1px dashed rgba(180,93,0,.3)}
.vcat{background:var(--paper);border:1px solid var(--rule);border-radius:9px;margin-bottom:10px;overflow:hidden}
.vcath{display:flex;align-items:center;gap:9px;padding:11px 15px;background:var(--bg);border-bottom:1px solid var(--rule)}
.vcati{width:9px;height:9px;border-radius:2px;flex-shrink:0}
.vcatl{font-size:13px;font-weight:700;color:var(--ink);flex:1}
.vcatn{font-size:11px;color:var(--ink-faint)}
.vgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.vcell{padding:14px 15px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.vname{font-size:13px;font-weight:700;color:var(--ink);margin-bottom:4px}
.vpurp{font-size:12px;color:var(--ink-soft);line-height:1.4;margin-bottom:8px}
.vmeta{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.vtag{font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px;letter-spacing:.01em}
.v-mod{background:#FEF3C7;color:#92400E}
.v-complex{background:#FEE2E2;color:#991B1B}
.v-low{background:#F0FDF4;color:#14532D}
.v-med{background:#FEF3C7;color:#92400E}
.v-high{background:#FEE2E2;color:#991B1B}
.vappr{font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px;background:#FEF3C7;color:#92400E}
.vnote{font-size:11.5px;color:var(--ink-faint);line-height:1.5;border-top:1px solid var(--rule);padding-top:8px;margin-top:8px}
.vst-wrap{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.vstb{font-size:10.5px;font-weight:700;padding:4px 8px;border-radius:4px;cursor:pointer;border:2px solid transparent;transition:all .15s;opacity:.45}
.vstb:hover{opacity:.75}
.vstb[aria-pressed="true"]{opacity:1;border-color:currentColor}
.vstb-none{background:var(--bg-alt);color:var(--ink-soft)}
.vstb-eval{background:rgba(42,111,219,.1);color:var(--accent)}
.vstb-ok{background:#F0FDF4;color:#14532D}
.vstb-done{background:var(--sidebar);color:var(--accent2)}
/* GTM */
.gtm-cat{background:var(--paper);border:1px solid var(--rule);border-radius:9px;margin-bottom:8px;overflow:hidden}
.gtm-cath{all:unset;display:flex;align-items:center;gap:10px;padding:12px 15px;background:var(--bg);border-bottom:1px solid var(--rule);cursor:pointer;width:100%;box-sizing:border-box}
.gtm-cath:hover{background:var(--bg-alt)}
.gtm-cat-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.gtm-cat-n{font-size:13px;font-weight:700;color:var(--ink);flex:1;text-align:left}
.gtm-cat-s{font-size:11px;color:var(--ink-faint)}
.gtm-body{border-top:1px solid var(--rule)}
.gtm-tk{display:flex;align-items:flex-start;gap:10px;padding:9px 15px;border-bottom:1px solid var(--rule);cursor:pointer;transition:background .15s}
.gtm-tk:last-child{border-bottom:none}
.gtm-tk:hover{background:var(--bg)}
.gtm-tk.dn{background:var(--bg)}
.gtm-lbl{font-size:12.5px;font-weight:500;color:var(--ink2);flex:1;line-height:1.4}
.gtm-lbl.dn{color:var(--ink-faint);text-decoration:line-through}
.gtm-owner{font-size:10px;font-weight:700;padding:2px 6px;border-radius:3px;background:var(--bg-alt);color:var(--ink-soft);white-space:nowrap;flex-shrink:0}
.gtm-prog{height:3px;background:var(--bg-alt);border-radius:2px;overflow:hidden;margin:0 8px;flex-shrink:0}
.gtm-prog-f{height:100%;border-radius:2px;background:var(--accent)}
.footer-note{font-size:10.5px;color:var(--ink-faint);text-align:center;margin-top:16px;line-height:1.6}
.storage-warning{background:#FFF9EC;border:1px solid rgba(180,93,0,.25);border-radius:8px;padding:10px 14px;margin-bottom:12px;font-size:11.5px;color:#7C3D00}
@keyframes pls{0%,100%{opacity:1}50%{opacity:.3}}
@media (max-width:640px){
  .vgrid{grid-template-columns:1fr}
  .vcell{border-right:none}
  .hdr-right{align-items:flex-start}
}
</style>
</head>

icate detection + conflict resolution + merge recommendations","h","L",0,0],["3-6","Candidate status system — color-coded with full immutable history tracking","c","M",0,1],["3-7","Open positions module — role, dept, salary, timezone, language, shift requirements","h","M",0,0],["3-8","HR pipeline kanban — drag-and-drop columns, candidate cards, filter bar","h","M",0,1],["3-9","Candidate search + advanced filter (role, status, location, skills, timezone, match score)","h","M",0,0],["3-10","Candidate full profile — 5 tabs: Overview, Resume, Interview, Notes, Intelligence","c","L",0,1],["3-11","Candidate activity log — full immutable audit of all changes and actions","h","M",0,0],["3-12","Recruiter + interviewer assignment system per candidate","h","M",0,0]]},{"id":4,"col":"#059669","n":"Phase 4 — Interview & Meeting System","s":"Scheduling, video APIs, in-app meeting room, invite customization","t":[["4-1","Interview scheduling workflow — assign, set time, send invite, confirm, track","c","M",0,0],["4-2","Zoom Enterprise API — OAuth meeting creation, link generation, recording webhooks","c","M",0,1],["4-3","Google Workspace Enterprise — Meet API OAuth, Calendar integration","c","M",0,1],["4-4","Microsoft 365 Enterprise E5 — Teams API (Graph), Azure AD, Exchange calendar","h","M",0,1],["4-5","In-app meeting room — embedded video, mute/camera, live chat, screen share, timer","h","L",0,1],["4-6","Interview status lifecycle — Scheduled → In Progress → Completed → SLA Active","c","S",0,0],["4-7","★ Meeting invite message composer — personalized text + merge tags per candidate","h","M",1,0],["4-8","★ Interviewer profile library — photo, name, title, dept per user","h","M",1,0],["4-9","★ Candidate welcome screen — who's joining + interviewer photos + client branding","h","L",1,0],["4-10","★ Branded invite email — candidate receives styled invite with interviewer cards","h","M",1,0],["4-11","★ Invite preview mode — recruiter sees exactly what candidate sees before sending","m var VENDORS = [{"cat":"Identity & Authentication","col":"#374151","v":[{"n":"Auth0 Enterprise","pur":"Multi-tenant user auth, invite flow, enterprise SSO, SAML/OIDC, anomaly detection","ph":"Phase 0","cx":"Moderate","cost":"Enterprise contract — custom pricing","appr":false,"risk":"Low","note":"An enterprise auth platform supporting unlimited tenants, custom domains, and enterprise SSO. This decision affects the entire multi-tenancy architecture."},{"n":"Okta Workforce Identity","pur":"Enterprise SSO, identity governance, SCIM provisioning, SAML federation","ph":"Phase 0","cx":"Moderate","cost":"Enterprise pricing — quote required","appr":false,"risk":"Low","note":"An enterprise identity platform. Integrates with Auth0 for federated identity. Required for enterprise clients expecting SSO on their corporate IdP."},{"n":"Duo Security (Cisco)","pur":"Enterprise 2FA — push notifications, hardware tokens, adaptive MFA, risk-based auth","ph":"Phase 0","cx":"Moderate","cost":"Enterprise pricing — quote required","appr":false,"risk":"Low","note":"An enterprise MFA option. Mandatory for Superuser and Admin roles. Adaptive MFA blocks suspicious logins automatically. Cisco-backed with enterprise SLA."}]},{"cat":"SaaS Infrastructure","col":"#2A6FDB","v":[{"n":"Stripe Enterprise","pur":"Subscription billing, metered usage, invoicing, tax, Customer Portal, custom SLA","ph":"Phase 13","cx":"Moderate","cost":"Enterprise pricing — quote required","appr":true,"risk":"Low","note":"Enterprise contract unlocks volume pricing, dedicated support, SLA, and data residency options. Required for global SaaS billing. Includes Stripe Tax for automated VAT/GST across 40+ countries."},{"n":"LaunchDarkly Enterprise","pur":"Feature flags per tenant per plan, gradual rollouts, audit log, enterprise SSO","ph":"Phase 1","cx":"Moderate","cost":"Enterprise pricing — quote required","appr":false,"risk":"Low","note":"Enterprise-grade feature management. Required for subscription tier feature gating. SOC 2 Type II compliant. Supports custom rules: enable feature X only when tenant.plan === \"enterprise\"."},{"n":"Vercel Enterprise","pur":"Next.js hosting, wildcard subdomain routing, edge network, team controls","ph":"Phase 0","cx":"Simple","cost":"Enterprise pricing — quote required","appr":false,"risk":"Low","note":"Native Next.js platform. Wildcard domains handle {client}.platform.com with zero config. Enterprise adds custom SLA, SAML SSO, audit logs, and dedicated support."},{"n":"Vanta","pur":"SOC 2 / ISO 27001 automation, continuous compliance monitoring, vendor risk","ph":"Phase 0","cx":"Moderate","cost":"Enterprise pricing — quote required","appr":false,"risk":"Low","note":"Automates a large share of SOC 2 evidence collection. Required from day one — compliance evidence must be gathered continuously. Enterprise clients will request SOC 2 report before signing."}]},{"cat":"Video Conferencing","col":"#059669","v":[{"n":"Zoom Enterprise","pur":"OAuth meeting creation, recording, transcription, enterprise admin controls, SSO","ph":"Phase 4","cx":"Moderate","cost":"Enterprise pricing — quote required","appr":true,"risk":"Medium","note":"Marketplace app approval is required before production use — confirm current review timelines directly with Zoom. Enterprise license includes advanced API limits, dedicated support, and SLA."},{"n":"Google Workspace Enterprise Plus","pur":"Meet API, Calendar API, enterprise admin, Drive, Vault, DLP, 24/7 support","ph":"Phase 4","cx":"Moderate","cost":"Enterprise Plus pricing — quote required","appr":true,"risk":"Low","note":"One Google Cloud project covers Meet, Calendar, Vision, and Translation APIs. Enterprise Plus includes advanced security, audit, and compliance. Required for Google-org enterprise clients."},{"n":"Microsoft 365 Enterprise E5","pur":"Teams API (Graph), Exchange, Azure AD, enterprise compliance, advanced security","ph":"Phase 4","cx":"Complex","cost":"E5 pricing — quote required","appr":true,"risk":"Medium","note":"Most complex video integration. Azure AD multi-tenant app registration required. E5 tier provides full Graph API access, advanced compliance, and eDiscovery. Budget extra sprint time."}]},{"cat":"AWS Enterprise (Cloud Infrastructure)","col":"#EA580C","v":[{"n":"AWS Enterprise Support + S3","pur":"File storage, 15-min response SLA, TAM, concierge support, architectural reviews","ph":"Phase 0","cx":"Simple","cost":"Enterprise Support pricing — quote required","appr":false,"risk":"Low","note":"Enterprise Support is commonly used at production scale. Includes Technical Account Manager (TAM), concierge support, and architectural guidance. Critical for multi-tenant data isolation strategy."},{"n":"AWS Textract Enterprise","pur":"OCR at scale — resume parsing, screenshot extraction, structured form parsing","ph":"Phase 6","cx":"Moderate","cost":"Enterprise pricing — volume discount negotiable","appr":false,"risk":"Low","note":"Production-grade OCR with enterprise throughput limits. Track per-tenant usage for metered billing. Pair with Google Cloud Vision for Russian handwriting accuracy."},{"n":"AWS RDS + ElastiCache Enterprise","pur":"Managed PostgreSQL (Multi-AZ, read replicas) + Redis for caching and SLA queues","ph":"Phase 0","cx":"Moderate","cost":"Enterprise pricing — quote required","appr":false,"risk":"Low","note":"Multi-AZ RDS with automated failover and read replicas. ElastiCache Redis for Bull Queue SLA timers. Row-level security in PostgreSQL is the foundation of multi-tenancy."},{"n":"AWS SES + Simple Email Sending","pur":"Transactional email at scale — SLA follow-ups, meeting invites, billing notifications","ph":"Phase 5","cx":"Simple","cost":"Enterprise pricing — quote required","appr":true,"risk":"Low","note":"Exit SES sandbox in Phase 0. Configure per-tenant white-label From: addresses. Requires domain verification and SPF/DKIM/DMARC. Complements SendGrid Premier for marketing flows."}]},{"cat":"AI & Intelligence","col":"#4338CA","v":[{"n":"OpenAI Enterprise","pur":"GPT-4o transcript analysis, keyword extraction, sentiment, match reasoning at scale","ph":"Phase 8","cx":"Moderate","cost":"Enterprise — custom pricing, zero data retention","appr":false,"risk":"Medium","note":"Enterprise agreement includes: no model training on your data, zero data retention, SOC 2 compliance, dedicated capacity, and enterprise SLA. Required before processing candidate transcripts in production."},{"n":"Anthropic Claude Enterprise","pur":"Hybrid AI for transcript analysis, matching engine validation, structured output","ph":"Phase 8","cx":"Moderate","cost":"Enterprise — custom pricing, BAA available","appr":false,"risk":"Low","note":"Enterprise agreement mirrors OpenAI: no training on data, privacy controls, dedicated support. Used for nuanced HR analysis. Use in parallel with OpenAI for cross-validation on critical decisions."},{"n":"Elastic Enterprise (Elasticsearch)","pur":"Full-text transcript search, candidate indexing, trend aggregation, Kibana dashboards","ph":"Phase 8","cx":"Complex","cost":"Enterprise pricing — quote required","appr":false,"risk":"Medium","note":"Dedicated Elastic Cloud cluster with enterprise support, SAML SSO, and encryption at rest. Index schema must be designed in Phase 8 planning — difficult to change post-ingestion. Namespace by tenant ID."},{"n":"Deepgram Enterprise","pur":"Speech analysis — pace, filler words, hesitation, speaker diarization, word-level timestamps for BII","ph":"Phase 8.5","cx":"Moderate","cost":"Enterprise — custom contract, volume pricing","appr":false,"risk":"Low","note":"A speech intelligence API. Deepgram Enterprise includes: data privacy guarantees, no model training on your audio, SOC 2 compliance, dedicated throughput, and SLA. Required for Behavioral Interview Intelligence module speech analysis layer."},{"n":"Azure AI Video Indexer","pur":"Lightweight video intelligence — high-level engagement analysis only for BII; NO protected characteristic inference","ph":"Phase 8.5","cx":"Moderate","cost":"Enterprise — Azure Cognitive Services, consumption-based","appr":false,"risk":"Low","note":"Microsoft enterprise-grade video analysis. Already in Azure ecosystem (Teams integration). Used for high-level facial engagement only per BII spec — system is hardcoded to never infer race, ethnicity, religion, medical conditions, or any protected characteristic."},{"n":"Google Cloud Vision Enterprise","pur":"Russian handwriting OCR, multilingual document parsing, superior to Textract for CIS scripts","ph":"Phase 6","cx":"Moderate","cost":"Enterprise pricing — volume discount negotiable","appr":false,"risk":"Low","note":"Used for Russian, Ukrainian, and Georgian handwriting recognition. One GCP project covers Vision, Meet, Calendar, and Translation. Track per-tenant calls for metered billing."}]},{"cat":"Email & Communications","col":"#DB2777","v":[{"n":"SendGrid Premier (Twilio)","pur":"Branded transactional email — meeting invites with interviewer cards, SLA follow-ups","ph":"Phase 5","cx":"Simple","cost":"Premier pricing — quote required","appr":true,"risk":"Low","note":"Premier tier includes dedicated IP pools, email deliverability consulting, and a Technical Account Manager. Supports per-tenant white-label From: addresses. Critical for branded meeting invite emails."},{"n":"Twilio Enterprise","pur":"SMS escalations, WhatsApp notifications, voice, enterprise support, SLA contract","ph":"Phase 5","cx":"Moderate","cost":"Enterprise — custom contract, volume pricing","appr":true,"risk":"Low","note":"Enterprise contract includes priority support, SLA, custom pricing, and dedicated account team. A2P 10DLC registration is required for US SMS; confirm current processing time directly with the provider. Required for 72-hour manager SLA escalation."}]},{"cat":"LinkedIn & Sourcing","col":"#1D4ED8","v":[{"n":"LinkedIn Talent Solutions (Enterprise)","pur":"LinkedIn Recruiter, InMail credits, Recruiter System Connect (RSC) API integration","ph":"Phase 3","cx":"Comp var STORAGE_PREFIX = 'hrRoadmapDemo:';
var memoryStore = {};
var storageAvailable = (function(){
  try {
    var t = '__hr_roadmap_demo_probe__';
    window.localStorage.setItem(t, '1');
    window.localStorage.removeItem(t);
    return true;
  } catch (e) { return false; }
})();
function safeGet(key){
  if (storageAvailable) {
    try {
      var raw = window.localStorage.getItem(STORAGE_PREFIX + key);
      if (!raw) return {};
      var parsed = JSON.parse(raw);
      if (parsed && typeof parsed === 'object' && !Array.isArray(parsed)) return parsed;
      return {};
    } catch (e) { return {}; }
  }
  return memoryStore[key] || {};
}
function safeSet(key, value){
  if (storageAvailable) {
    try { window.localStorage.setItem(STORAGE_PREFIX + key, JSON.stringify(value)); return; }
    catch (e) { /* fall through to memory */ }
  }
  memoryStore[key] = value;
}
function safeClearAll(){
  // Only ever clears THIS demo's three namespaced keys — never localStorage.clear().
  if (storageAvailable) {
    try {
      window.localStorage.removeItem(STORAGE_PREFIX + 'tasks');
      window.localStorage.removeItem(STORAGE_PREFIX + 'vendors');
      window.localStorage.removeItem(STORAGE_PREFIX + 'gtm');
    } catch (e) {}
  }
  memoryStore = {};
}

  h += '</div>';

  VENDORS.forEach(function(cat){
    h += '<div class="vcat"><div class="vcath"><span class="vcati" style="background:' + cat.col + '" aria-hidden="true"></span><span class="vcatl">' + esc(cat.cat) + '</span><span class="vcatn">' + cat.v.length + ' vendor' + (cat.v.length > 1 ? 's' : '') + '</span></div><div class="vgrid">';
    cat.v.forEach(function(v){
      var key = vendorKey(cat, v);
      var st = vs[key] || 'none';
      var cx = v.cx === 'Simple' ? '' : (v.cx === 'Moderate' ? 'v-mod' : 'v-complex');
      var rt = v.risk === 'Low' ? 'v-low' : (v.risk === 'Medium' ? 'v-med' : 'v-high');
      h += '<div class="vcell">';
      h += '<div class="vname">' + esc(v.n) + '</div><div class="vpurp">' + esc(v.pur) + '</div>';
      h += '<div class="vmeta">';
      h += '<span class="vtag v-ph">' + esc(v.ph) + '</span>';
      h += cx ? ('<span class="vtag ' + cx + '">' + esc(v.cx) + '</span>') : '<span class="vtag" style="background:#F0FDF4;color:#14532D">Simple setup</span>';
      h += '<span class="vtag" style="background:var(--sidebar);color:var(--accent2)">' + esc(v.cost) + '</span>';
      h += '<span class="vtag ' + rt + '">Risk: ' + esc(v.risk) + '</span>';
      if (v.appr) h += '<span class="vtag vappr">⚠ Approval required</span>';
      h += '</div>';
      h += '<div class="vst-wrap" role="group" aria-label="Integration status for ' + esc(v.n) + '">';
      ['none','eval','contracted','integrated'].forEach(function(s){
        h += '<button class="vstb ' + stCls[s] + '" aria-pressed="' + (st === s) + '" data-action="set-vendor-status" data-vendor-key="' + esc(key) + '" data-status="' + s + '">' + stMap[s] + '</button>';
      });
      h += '</div>';
      h += '<div class="vnote">' + esc(v.note) + '</div>';
      h += '</div>';
    });
    h += '</div></div>';
  });
  return h;
}

function renderGtm(gc){
  var h = '';
  h += '<div class="banner"><strong style="font-size:12.5px">Your demo progress: ' + gc.done + ' of ' + gc.total + ' GTM checklist items checked.</strong>';
  h += '<div style="font-size:11px;color:#555A63;margin-top:4px">GTM preparation is planned to run in parallel with the later build phases; legal, compliance, and key vendor actions are planned to start earlier. Checking an item here is a demo interaction only.</div></div>';
  GTM.forEach(function(cat, ci){
    var cd = cat.items.filter(function(i){ return gtmDone[i[0]]; }).length;
    var ct = cat.items.length;
    var cp = ct ? Math.round(cd/ct*100) : 0;
    var isOp = isGtmOpen(ci);
    var bodyId = 'gtm-body-' + ci;
    h += '<div class="gtm-cat">';
    h += '<button class="gtm-cath" aria-expanded="' + isOp + '" aria-controls="' + bodyId + '" data-action="toggle-gtm-cat" data-gtm-cat-index="' + ci + '">';
    h += '<span class="gtm-cat-dot" style="background:' + cat.col + '" aria-hidden="true"></span>';
    h += '<span class="gtm-cat-n">' + esc(cat.cat) + '</span>';
    h += '<span class="gtm-prog" style="width:80px"><span class="gtm-prog-f" style="width:' + cp + '%"></span></span>';
    h += '<span class="gtm-cat-s">' + cd + '/' + ct + '</span>';
    h += '<span class="pharr' + (isOp ? ' op' : '') + '" aria-hidden="true" style="margin-left:6px">›</span>';
    h += '</button>';
    if (isOp) {
      h += '<div class="gtm-body" id="' + bodyId + '">';
      cat.items.forEach(function(item){
        var isDone = !!gtmDone[item[0]];
        var cbId = 'gtm-cb-' + item[0];
        h += '<label class="gtm-tk' + (isDone ? ' dn' : '') + '" for="' + cbId + '">';
        h += '<span class="cb-wrap"><input type="checkbox" id="' + cbId + '" class="cb-input" data-action="toggle-gtm" data-gtm-id="' + item[0] + '"' + (isDone ? ' checked' : '') + '><span class="cb' + (isDone ? ' ck' : '') + '" aria-hidden="true">' + (isDone ? CHECK_SVG : '') + '</span></span>';
        h += '<span class="gtm-lbl' + (isDone ? ' dn' : '') + '">' + esc(item[1]) + '</span>';
        h += '<span class="gtm-owner">' + esc(item[2]) + '</span>';
        h += '<span class="tag ' + PC[item[3]] + '" style="margin-left:4px">' + PL[item[3]] + '</span>';
        h += '</label>';
      });
      h += '</div>';
    }
    h += '</div>';
  });
  return h;
}

// ---- Event delegation ----
root.addEventListener('click', function(e){
  var el = e.target.closest('[data-action]');
  if (!el) return;
  var action = el.getAttribute('data-action');
  if (action === 'set-mode') { mode = el.getAttribute('data-mode'); render(); }
  else if (action === 'set-filter') { fl = el.getAttribute('data-filter'); render(); }
  else if (action === 'toggle-phase') { var i = el.getAttribute('data-phase-index'); op[i] = !isPhaseOpen(i); render(); }
  else if (action === 'toggle-gtm-cat') { var gi = el.getAttribute('data-gtm-cat-index'); gtmOp[gi] = !isGtmOpen(gi); render(); }
  else if (action === 'set-vendor-status') {
    var key = el.getAttribute('data-vendor-key');
    var status = el.getAttribute('data-status');
    vs[key] = status;
    persist();
    render();
  }
});
root.addEventListener('change', function(e){
  var el = e.target;
  if (el.matches('[data-action="toggle-task"]')) {
    var id = el.getAttribute('data-task-id');
    dn[id] = el.checked;
    persist();
    render();
  } else if (el.matches('[data-action="toggle-gtm"]')) {
    var gid = el.getAttribute('data-gtm-id');
    gtmDone[gid] = el.checked;
    persist();
    render();
  }
});

// ---- Parent-controlled reset (same-origin direct call, no postMessage spoofing surface) ----
window.__hrRoadmapDemo = {
  reset: function(){
    dn = {}; vs = {}; gtmDone = {};
    safeClearAll();
    render();
  }
};

// ---- Escape key inside the iframe closes the parent modal ----
document.addEventListener('keydown', function(e){
  if (e.key === 'Escape' && window.parent && window.parent !== window) {
    try { window.parent.postMessage({ source: 'hr-roadmap-demo', type: 'escape' }, window.location.origin); } catch (err) {}
  }
});

// ---- Tell the parent we've loaded (parent validates origin+source before acting) ----
if (window.parent && window.parent !== window) {
  try { window.parent.postMessage({ source: 'hr-roadmap-demo', type: 'ready' }, window.location.origin); } catch (err) {}
}

render();
})();
</script>
